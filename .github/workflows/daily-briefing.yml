name: Daily AI Briefing

on:
  schedule:
    - cron: "5 1 * * *"    # 01:05 UTC = 오전 10:05 KST (1차 시도)
    - cron: "20 1 * * *"   # 01:20 UTC = 오전 10:20 KST (2차 시도)
    - cron: "35 1 * * *"   # 01:35 UTC = 오전 10:35 KST (3차 시도)
    - cron: "50 1 * * *"   # 01:50 UTC = 오전 10:50 KST (4차 시도)
                            # GitHub의 schedule 트리거는 100% 보장되지 않아(공식 문서 명시) 한
                            # 번이라도 놓칠 확률을 낮추려고 15분 간격으로 4번 시도한다. 이미
                            # 성공한 뒤에 또 도는 시도는 아래 "이미 오늘자로 갱신됐는지 확인"
                            # 단계에서 몇 초 만에 스킵되므로 비용/중복 걱정은 없음.
  workflow_dispatch: {}     # 수동으로 즉시 실행해서 테스트하고 싶을 때 사용

permissions:
  contents: write
  id-token: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 이미 오늘자로 갱신됐는지 확인
        id: check
        run: |
          TODAY_KST=$(TZ='Asia/Seoul' date +%Y년\ %-m월\ %-d일)
          if grep -q "$TODAY_KST" index.html; then
            echo "already_done=true" >> "$GITHUB_OUTPUT"
            echo "오늘(${TODAY_KST})자로 이미 갱신되어 있어 이번 실행은 건너뜁니다."
          else
            echo "already_done=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.check.outputs.already_done != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Write,Edit,Grep,Glob,WebSearch,WebFetch"
            --max-turns 100
          prompt: |
            너는 매일 오전 10시(KST)에 실행되는 "AI 데일리 브리핑" 자동화 작업이다.
            목적: (A) Claude(Anthropic), ChatGPT/GPT(OpenAI), Gemini(Google) 세 곳의 최신 소식,
            (B) 챗봇·음악·이미지·영상 등 카테고리 상관없이 이번 주 실제로 가장 화제였던 AI 랭킹
            TOP3, (C) 영상·이미지·음악을 만드는 생성 AI(Runway, Veo, Sora, Midjourney, Nano Banana,
            Suno, Udio 등) 소식을 조사해서 이 저장소 루트의 index.html을 최신 내용으로 갱신하고
            git으로 커밋·푸시하는 것이다. 사용자는 한국인이라 한국어 콘텐츠를 선호한다. index.html은
            이미 4개 구역으로 구성되어 있다: 상단 "🏆 금주에 핫한 AI 순위 TOP3"(class="spotlight",
            1~3위가 가로로 넓은 바 형태로 세로로 쌓여있음), 그 아래 "🤖 챗봇형 AI 빅3 최신 소식"
            제목(class="grid-section-head")과 3단 컬럼 Claude/GPT/Gemini(class="grid"),
            "🎬🎨🎵 영상·이미지·음악 생성 AI"(class="media-section", 내부에 영상/이미지/음악 3개
            mcol), 맨 하단 "오늘의 AI 활용 가이드"(class="guide"). 이 구조를 절대 바꾸지 말고 각
            구역의 내용만 매일 최신화한다. 특히 spotlight와 grid 사이에 구분선·제목이 있어야
            섹션이 뭉쳐 보이지 않으니, grid-section-head를 절대 지우지 않는다.

            [영상 배치 규칙 — Claude/GPT/Gemini 컬럼]
            - 각 컬럼(Claude/GPT/Gemini) 맨 위, col-head 바로 아래에 "🎬 주요 영상 (한국어, 중요도순)"
              섹션(class="videos top-videos")을 배치한다. 뉴스 항목(class="item")들보다 항상 위에 온다.
            - 영상은 회사당 3~5개를 목표로 하되, 실제로 검색해서 찾은 것만 넣는다. 가장 중요한 소식을
              다루는 영상 순으로 ①②③... 번호를 매겨 정렬한다.
            - 영상은 반드시 한국어 콘텐츠만 사용한다(한국어 제목/음성 또는 한국어 자막). 영어 영상은
              절대 넣지 않는다. 못 찾으면 억지로 채우지 말고 개수를 줄이거나 안내 문구를 작게 추가한다.
            - 링크나 제목을 지어내지 말 것 — WebSearch로 실제 확인된 것만 사용한다.

            [금주에 핫한 AI 순위 TOP3 — class="spotlight"]
            - 챗봇 AI든 음악 AI든 이미지 AI든 영상 AI든 카테고리를 가리지 않고, 이번 주(최근 1~2주)
              실제로 가장 화제였던 "AI 3개"를 순위(1~3위)로 뽑는다. 회사/제품 단위로 하나씩, 총 3개.
              같은 회사가 중복으로 여러 자리를 차지하지 않도록 한다 — 카테고리가 최대한 겹치지 않게
              다양성 있게 고른다(예: 챗봇 1개 + 음악 1개 + 이미지 1개, 또는 그 주에 실제로 제일
              화제였던 조합이 다르면 그에 맞게).
            - "화제성"의 근거는 사용자 수·다운로드/앱 순위 급상승, 대형 투자·인수, 논란·소송, 신모델
              출시 반응, SNS·커뮤니티 화제도 등을 종합 판단한다. 단순 스펙 자랑이 아니라 "왜 이번 주
              특히 화제였는지" 근거를 반드시 1문장(class="why")으로 명시한다.
            - HTML 구조는 반드시 이 형태를 유지한다(가로로 넓은 바 형태 카드가 1위→2위→3위 순서로
              세로로 쌓이는 구조. 순위별 색상은 CSS에 이미 정의돼 있음 — rank-1/2/3 클래스와 🥇🥈🥉
              이모지, class="cat-tag"에 카테고리명 예: 챗봇 AI/음악 AI/이미지 AI/영상 AI):
              <div class="spot-card rank-N">
                <div class="spot-rank"><span class="medal">[메달]</span><span class="rank-num">N위</span><span class="cat-tag">[카테고리]</span></div>
                <div class="spot-body"><h3>[AI 이름]</h3><div class="why">왜 N위? — [한 줄 근거]</div><p>[2~3문장 설명]</p><a href="[출처]" target="_blank">[링크 텍스트] →</a></div>
              </div>
            - 반드시 실제로 검색해 확인한 소식만 사용한다. 이번 주에 확실히 화제성 있는 후보가 3개가
              안 되면 최근 2~3주까지 범위를 넓혀서라도 3개를 채운다(순위 코너이므로 개수를 줄이지
              않는다 — 단, 여전히 지어내지는 않는다).

            [영상·이미지·음악 생성 AI — class="media-section"]
            - 내부에 mcol video / mcol image / mcol music 3개 섹션이 있다. 각각 대표적인 도구
              (영상: Runway, Veo, Sora, Kling, Pika 등 / 이미지: Midjourney, Nano Banana(Bimg AI),
              DALL-E, Flux, Ideogram 등 / 음악: Suno, Udio, Google Lyria 등)의 최신 소식이나 신기능을
              항목당 1~3개(class="item") 유지한다.
            - 뉴스가 아니어도, 그 시점 기준 대표 도구·버전 소개여도 괜찮다(너무 오래되지 않은 선에서).
              날짜를 정확히 확인해 item-date에 표기하고, 몇 달 이상 지난 소식이면 "최근"이라고
              뭉뚱그리지 말고 실제 날짜(YYYY.MM 또는 YYYY.MM.DD)를 그대로 쓴다.
            - 이 섹션도 유튜브 영상을 곁들이고 싶으면 자유롭게 추가해도 되지만 필수는 아니다(간결함 우선).

            [언어 전략 - 하이브리드, 전 구역 공통]
            - 공식 발표/릴리스노트: 영어 원문 기준 조사 가능하지만 요약은 반드시 한국어로 쓰고
              <span class="badge">번역 요약</span> 배지를 붙인다. 한국어 공식 소스가 있으면
              (예: blog.google/intl/ko-kr) 그것을 우선 사용하고 <span class="badge kr">한국어 공식</span>.
            - 뉴스 기사도 한국어 매체를 우선 검색해서 <span class="badge kr">국내 보도</span> 또는
              <span class="badge kr">한국어 리뷰</span> 배지를 붙인다.

            [절차]
            1. WebSearch/WebFetch로 다음을 확인해 지난 24~48시간(부족하면 최근 1~2주) 내 새 소식을 찾는다:
               - https://www.anthropic.com/news , Claude 릴리스노트
               - https://openai.com/products/release-notes/ , https://help.openai.com 관련 페이지
               - https://ai.google.dev/gemini-api/docs/changelog , https://deepmind.google ,
                 https://blog.google , https://blog.google/intl/ko-kr (한국어 공식 우선 확인)
               - 한국어 뉴스: "클로드", "챗GPT", "제미나이" + 모델명으로 국내 IT 매체 검색
               - "이번주 AI 화제", "AI 트렌드" 등으로 업계 전반 화제 소식 검색 (spotlight용)
               - "영상 생성 AI", "이미지 생성 AI", "음악 생성 AI" + 최신/신기능 등으로 각 도구별 검색
               - 유튜브: 위 영상 배치 규칙대로 한국어 영상 검색
            2. Read로 현재 index.html을 읽어 기존 디자인/구조/CSS/배지 스타일을 파악한다. 절대 CSS나
               전체 레이아웃 구조(4개 구역)를 바꾸지 말고, 각 구역 내용만 최신화한다.
            3. Claude/GPT/Gemini 각 컬럼의 뉴스 항목은 최신순으로 4~5개만 남긴다(오래된 것 제거). 각
               항목은 날짜, 배지, 2~3문장 한국어 요약, 실제 확인된 출처 링크를 포함해야 한다.
            4. 특정 회사·영역에서 새 소식/영상을 못 찾았으면 기존 항목을 그대로 유지한다.
            5. 상단 "마지막 업데이트" 문구를 오늘 날짜/오전 10:00 KST로 갱신한다. 날짜 표기는
               반드시 "YYYY년 M월 D일" 형식(예: "2026년 8월 18일", 월/일 앞에 0을 붙이지 않음)을
               그대로 유지한다 — 이 형식이 워크플로의 중복 실행 방지 체크에 사용되므로 형식이
               달라지면 안 된다.
            6. "오늘의 AI 활용 가이드" 섹션도 최신 소식(영상·이미지·음악 AI 포함)을 반영해 간단히 갱신한다.
            7. Edit/Write로 index.html을 갱신한 뒤, 다음을 실행해 커밋·푸시한다:
               git config user.name "ai-daily-briefing-bot"
               git config user.email "actions@users.noreply.github.com"
               git add index.html
               git commit -m "Daily update: $(date -u +%Y-%m-%d) AI briefing"
               git push
            8. 무인 실행이다. 질문하지 말고 절차를 그대로 수행한다. 커밋 메시지 외에 별도 보고는 필요 없다.
